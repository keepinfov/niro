[package]
name = "niro"
version = "0.1.0"
edition = "2021"
description = "Network Interface Rules Orchestrator - Lightweight packet filtering CLI"
license = "MIT"
authors = ["niro contributors"]
keywords = ["network", "firewall", "packet-filter", "cli"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.70"

[dependencies]
# CLI parsing - minimal and fast
clap = { version = "4", features = ["derive"] }

# Configuration parsing
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Regex module support
regex = "1"

# Error handling
thiserror = "1"

# IP network handling (lightweight)
ipnet = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
